    - id: uxd
      command: speckit.one-way-door.uxd
      integration: '{{ inputs.integration }}'
      input:
        args: slug={{ inputs.slug }}
    - id: trd
      command: speckit.one-way-door-engineering.trd
      integration: '{{ inputs.integration }}'
      input:
        args: slug={{ inputs.slug }}
    - id: tpd
