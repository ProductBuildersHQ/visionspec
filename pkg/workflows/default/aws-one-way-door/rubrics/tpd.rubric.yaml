id: tpd-rubric
name: AWS TPD Rubric
version: "2.0"
description: >-
  Test Plan Document evaluation for product-level one-way-door launches.
  implementation_readiness categories are blocking gates on whether the
  customer promise and every irreversible commitment are actually proven
  before launch. bar_raiser_readiness and frugality are Leadership Principle
  lenses and never block on their own.
evaluationType: analytic
judgeInstructions:
  - Cite the relevant section and Press/FAQ/PRD/TRD/OWD/TC ID for every finding.
  - A coverage row referencing a test case ID that does not exist elsewhere in the document is a fail, not a pass.
  - An OWD/TWD commitment with no §3 pre-launch proof row — or a proof not executed at the stated launch scale — is a fail on decision_reversibility; there is no rollback to fall back on.
  - A reversible decision whose rollback has never been executed is a fail on decision_reversibility, not a pass with a note.
  - A risk tier below high for a public product launch requires an explicit justification; absent one, treat the tier as unstated.
  - Distinguish configured from tested for observability — an alert that has never fired is a gap.
passCriteria:
    minCategoriesPassing: all_required
    maxFindingsSeverity:
        critical: 0
        high: 0
        medium: 2
        low: -1
categories:
    - id: customer_experience_validation
      name: Customer Experience Validation
      description: Tests validate the customer experience promised in the Press Release.
      weight: 0.20
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: deterministic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Test scenarios directly map to Press Release customer promises via the §2 Promise and Requirement Traceability table
            - value: partial
              label: Partial
              criteria:
                - Some customer experience testing but gaps in coverage
            - value: fail
              label: Fail
              criteria:
                - No connection to customer experience validation
    - id: working_backwards_traceability
      name: Working Backwards Traceability
      description: Tests trace back through PRD, UXD, TRD, and IRD to the original Press Release vision.
      weight: 0.15
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: deterministic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - "§2 chain and §5 coverage matrices link tests through PRD/UXD/TRD/IRD to the Press Release with no dangling IDs"
            - value: partial
              label: Partial
              criteria:
                - Some traceability but missing intermediate links
            - value: fail
              label: Fail
              criteria:
                - No working backwards traceability
    - id: decision_reversibility
      name: Irreversibility Validation and Containment
      description: One-way-door profile — every irreversible commitment is proven pre-launch at launch scale, and every reversible decision has an executed rollback.
      weight: 0.12
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: deterministic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Every OWD/TWD commitment has a §3 pre-launch proof executed at the stated launch scale
                - Every reversible decision has a §4 row with rollback actually executed
                - Launch-scale definition states a number, not a qualitative label
            - value: partial
              label: Partial
              criteria:
                - Proof rows exist but some not executed at scale, or rollbacks reviewed rather than executed
            - value: fail
              label: Fail
              criteria:
                - An irreversible commitment with no pre-launch proof, or no §3/§4 sections at all
    - id: bar_raiser_readiness
      name: Bar Raiser Readiness
      description: Insist on the Highest Standards — would this test plan pass bar raiser review before an irrevocable launch?
      weight: 0.15
      required: false
      class: leadership_principle
      blocking: false
      evaluation: human
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Comprehensive plan demonstrating ownership and customer obsession, proportionate to a launch with no way back
            - value: partial
              label: Partial
              criteria:
                - Good plan but missing depth in some areas
            - value: fail
              label: Fail
              criteria:
                - Would not pass bar raiser review
    - id: operational_excellence
      name: Operational Excellence Testing
      description: Chaos, GameDay, DR, runbook, and observability testing, scaled to the stated risk tier.
      weight: 0.13
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: deterministic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Risk tier stated with justification; chaos and GameDay scope match it
                - DR recovery procedure executed pre-launch, not scheduled for later
                - Observability validation confirms alerts fire; runbook procedures are executed, not only reviewed
            - value: partial
              label: Partial
              criteria:
                - Risk tier stated but scope doesn't match, or observability described as configured only
            - value: fail
              label: Fail
              criteria:
                - No risk tier stated, or section blank
    - id: automation_first
      name: Automation First
      description: Test automation is prioritized appropriately, including contract tests in the pipeline.
      weight: 0.13
      required: false
      class: specification_quality
      blocking: false
      evaluation: semantic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Clear automation strategy with pipeline integration and a pre-launch gate on §3 proofs
            - value: partial
              label: Partial
              criteria:
                - Some automation but manual-heavy plan
            - value: fail
              label: Fail
              criteria:
                - No automation strategy
    - id: frugality
      name: Frugality
      description: Test plan is efficient without unnecessary complexity — rigor concentrated where irreversibility demands it.
      weight: 0.12
      required: false
      class: leadership_principle
      blocking: false
      evaluation: semantic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Lean plan with depth concentrated on the irreversible commitments; reversible scope tested proportionately
            - value: partial
              label: Partial
              criteria:
                - Some unnecessary complexity
            - value: fail
              label: Fail
              criteria:
                - Over-engineered or wasteful approach, or uniform depth that starves the irreversible core
