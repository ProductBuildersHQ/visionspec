id: uxd-rubric
name: AWS Product UXD Rubric
version: "2.0"
description: >-
  User Experience Design evaluation for product-level one-way-door launches.
  implementation_readiness categories are blocking gates on whether the
  announced experience is complete enough to implement without inventing
  states, permission behavior, or copy. user_understanding and content_craft
  are Leadership Principle lenses (Customer Obsession, Earn Trust, Highest
  Standards) and never block on their own.
evaluationType: analytic
judgeInstructions:
  - Cite the relevant section and PRD story ID for every finding.
  - A Press Release promise with no §2 journey mapping is a fail on press_promise_alignment — an announced experience nobody designed.
  - A journey with no Traces To reference is a fail on requirements_traceability regardless of detail elsewhere.
  - Copy marked Provisional with a stated reason is acceptable; copy with no status marker is a gap.
  - A permission-differentiated views table stating "Not applicable — single-permission experience" is a pass.
passCriteria:
    minCategoriesPassing: all_required
    maxFindingsSeverity:
        critical: 0
        high: 0
        medium: 2
        low: -1
categories:
    - id: user_understanding
      name: User Understanding
      description: Customer Obsession — clear understanding of target users and their needs, grounded in research.
      weight: 0.08
      required: false
      class: leadership_principle
      blocking: false
      evaluation: semantic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Target users identified with key insights from research methods actually used
            - value: partial
              label: Partial
              criteria:
                - Users mentioned but insights thin
            - value: fail
              label: Fail
              criteria:
                - No user understanding demonstrated
    - id: press_promise_alignment
      name: Press Promise Alignment
      description: Every Press Release promise is delivered by a mapped journey, and every journey serves a promise.
      weight: 0.10
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: deterministic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - "§2 maps every headline promise to a journey and PRD story that exist in this document set"
                - Journeys with no promise mapping are justified or absent
            - value: partial
              label: Partial
              criteria:
                - Mapping table present but some promises or journeys unmapped
            - value: fail
              label: Fail
              criteria:
                - No promise alignment, or a headline promise with no designed journey
    - id: requirements_traceability
      name: Requirements Traceability
      description: Does every journey trace to a PRD story?
      weight: 0.10
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: deterministic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Every journey has a Traces To story ID that exists in the PRD
            - value: fail
              label: Fail
              criteria:
                - No traceability to PRD requirements
    - id: first_run_experience
      name: First-Run Experience
      description: The day-1 experience is designed, traced, and has a measurable time-to-first-value.
      weight: 0.08
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: deterministic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - "§4 defines the first-run journey with resulting states and a measurable time-to-first-value target"
            - value: partial
              label: Partial
              criteria:
                - First-run steps sketched but resulting states or the time-to-first-value target missing
            - value: fail
              label: Fail
              criteria:
                - No first-run design for a new product
    - id: user_journey
      name: User Journeys
      description: Journeys with a resulting state per step.
      weight: 0.08
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: deterministic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Journeys cover the announced experience; every step has a resulting state, not only an action
            - value: partial
              label: Partial
              criteria:
                - Journeys described but resulting states missing for some steps
            - value: fail
              label: Fail
              criteria:
                - No user journeys
    - id: information_architecture
      name: Information Architecture
      description: Navigation structure and content hierarchy.
      weight: 0.06
      required: false
      class: specification_quality
      blocking: false
      evaluation: semantic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Clear navigation structure with content hierarchy
            - value: partial
              label: Partial
              criteria:
                - Structure mentioned but hierarchy unclear
            - value: fail
              label: Fail
              criteria:
                - No IA consideration
    - id: wireframes
      name: Wireframes
      description: Visual representations of screens.
      weight: 0.10
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: deterministic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Wireframes for all key screens with interactions noted
            - value: partial
              label: Partial
              criteria:
                - Some wireframes but incomplete coverage
            - value: fail
              label: Fail
              criteria:
                - No wireframes
    - id: interaction_design
      name: Interaction Design
      description: Every interaction has a resulting state or outcome.
      weight: 0.08
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: deterministic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Every interaction has a stated resulting state or outcome, not only a trigger
            - value: partial
              label: Partial
              criteria:
                - Happy path interactions defined but resulting state missing for some
            - value: fail
              label: Fail
              criteria:
                - No interaction design
    - id: state_completeness
      name: User-Visible State Completeness
      description: Are loading, empty, error, timeout, and recovery states defined?
      weight: 0.10
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: deterministic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - State matrix covers loading, empty, error, timeout, and recovery for every flow
            - value: partial
              label: Partial
              criteria:
                - Matrix present but one or more state types missing
            - value: fail
              label: Fail
              criteria:
                - No state matrix, or only the happy path documented
    - id: copy_status
      name: Copy Status
      description: Is every piece of user-facing copy marked Final or Provisional?
      weight: 0.06
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: deterministic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Every copy row has a Final or Provisional status
            - value: partial
              label: Partial
              criteria:
                - Most copy has a status but some entries silent on it
            - value: fail
              label: Fail
              criteria:
                - No copy status markers
    - id: content_craft
      name: Content Craft
      description: Earn Trust, Highest Standards — does the voice and tone definition genuinely guide copy for a new product?
      weight: 0.04
      required: false
      class: leadership_principle
      blocking: false
      evaluation: semantic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Voice/tone defined specifically enough to guide copy decisions for a product that has no inherited voice
            - value: partial
              label: Partial
              criteria:
                - Some guidance but generic
            - value: fail
              label: Fail
              criteria:
                - No content design
    - id: accessibility
      name: Accessibility
      description: WCAG 2.1 AA requirements with a testing plan.
      weight: 0.12
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: deterministic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - WCAG 2.1 AA checklist addressed with a concrete testing plan (automated, manual, screen reader)
            - value: partial
              label: Partial
              criteria:
                - Basic accessibility mentioned
            - value: fail
              label: Fail
              criteria:
                - No accessibility consideration
