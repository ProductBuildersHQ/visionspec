id: tpd-rubric
name: AWS TPD Rubric
version: "2.0"
description: >-
  Test Plan Document evaluation for AWS Working Backwards methodology.
  implementation_readiness categories are blocking gates on whether the
  customer promise and technical guarantees are actually proven.
  bar_raiser_readiness and frugality are Leadership Principle lenses and
  never block on their own.
evaluationType: analytic
judgeInstructions:
  - Cite the relevant section and Press/FAQ/PRD/TRD/TC ID for every finding.
  - A coverage row referencing a test case ID that does not exist elsewhere in the document is a fail, not a pass.
  - Chaos testing marked Not applicable with a risk-based rationale is a pass on operational_excellence; blank is a fail.
  - Distinguish configured from tested for observability — an alert that has never fired is a gap.
passCriteria:
    minCategoriesPassing: all_required
    maxFindingsSeverity:
        critical: 0
        high: 0
        medium: 2
        low: -1
categories:
    - id: customer_experience_validation
      name: Customer Experience Validation
      description: Tests validate the customer experience promised in the Press Release.
      weight: 0.20
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: deterministic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Test scenarios directly map to Press Release customer promises via the §3.1 table
            - value: partial
              label: Partial
              criteria:
                - Some customer experience testing but gaps in coverage
            - value: fail
              label: Fail
              criteria:
                - No connection to customer experience validation
    - id: working_backwards_traceability
      name: Working Backwards Traceability
      description: Tests trace back through FAQ, PRD, and TRD to the original vision.
      weight: 0.15
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: deterministic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Clear traceability from tests through PRD/TRD/FAQ to Press Release
            - value: partial
              label: Partial
              criteria:
                - Some traceability but missing intermediate links
            - value: fail
              label: Fail
              criteria:
                - No working backwards traceability
    - id: decision_reversibility
      name: Decision Reversibility Testing
      description: Tests consider reversibility of technical decisions.
      weight: 0.12
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: deterministic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Tests include rollback scenarios and feature flag on/off validation
            - value: partial
              label: Partial
              criteria:
                - Basic rollback testing but incomplete
            - value: fail
              label: Fail
              criteria:
                - No reversibility testing
    - id: bar_raiser_readiness
      name: Bar Raiser Readiness
      description: Insist on the Highest Standards — would this test plan pass bar raiser review?
      weight: 0.15
      required: false
      class: leadership_principle
      blocking: false
      evaluation: human
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Comprehensive plan demonstrating ownership and customer obsession
            - value: partial
              label: Partial
              criteria:
                - Good plan but missing depth in some areas
            - value: fail
              label: Fail
              criteria:
                - Would not pass bar raiser review
    - id: operational_excellence
      name: Operational Excellence Testing
      description: Chaos, runbook, and observability testing, scaled to the stated risk tier.
      weight: 0.13
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: deterministic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Risk tier stated; chaos testing scope matches it
                - Observability validation confirms alerts fire, not only that they're configured
                - Runbook procedures are executed, not only reviewed
            - value: partial
              label: Partial
              criteria:
                - Risk tier stated but scope doesn't match, or observability described as configured only
            - value: fail
              label: Fail
              criteria:
                - No risk tier stated, or section blank
    - id: automation_first
      name: Automation First
      description: Test automation is prioritized appropriately.
      weight: 0.13
      required: false
      class: specification_quality
      blocking: false
      evaluation: semantic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Clear automation strategy with pipeline integration
            - value: partial
              label: Partial
              criteria:
                - Some automation but manual-heavy plan
            - value: fail
              label: Fail
              criteria:
                - No automation strategy
    - id: frugality
      name: Frugality
      description: Test plan is efficient without unnecessary complexity.
      weight: 0.12
      required: false
      class: leadership_principle
      blocking: false
      evaluation: semantic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Lean test plan focused on high-value testing
            - value: partial
              label: Partial
              criteria:
                - Some unnecessary complexity
            - value: fail
              label: Fail
              criteria:
                - Over-engineered or wasteful approach
