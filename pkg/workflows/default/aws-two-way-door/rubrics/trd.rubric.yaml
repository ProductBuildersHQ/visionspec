id: trd-rubric
name: AWS Feature TRD Rubric
version: "2.0"
description: >-
  Technical Requirements Document evaluation for feature-level
  implementations. implementation_readiness categories are blocking gates on
  whether an agent could implement without guessing; technical_ownership is a
  Leadership Principle lens (Ownership, Dive Deep, Invent and Simplify,
  Highest Standards) and never blocks on its own.
evaluationType: analytic
judgeInstructions:
  - Cite the relevant section and TRD/PRD/TPD ID for every finding.
  - A traceability row with a Traces To or Verified By reference that does not exist elsewhere in the document is a fail, not a pass.
  - A migration/compatibility section marked Not applicable with a real rationale is a pass; blank is a fail.
  - Do not reward length; reward guarantees explicit enough for an agent to implement without inventing behavior.
passCriteria:
    minCategoriesPassing: all_required
    maxFindingsSeverity:
        critical: 0
        high: 1
        medium: 2
        low: -1
categories:
    - id: requirements_traceability
      name: Requirements Traceability
      description: Does every TRD requirement trace to a PRD requirement and a TPD verification?
      weight: 0.16
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: deterministic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Every TRD-ID row has a Traces To PRD reference and a Verified By TPD reference
            - value: partial
              label: Partial
              criteria:
                - Some traceability but gaps exist
            - value: fail
              label: Fail
              criteria:
                - No traceability to requirements
    - id: invariants
      name: Invariants
      description: Are cross-cutting guarantees stated as explicit, testable invariants?
      weight: 0.12
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: semantic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - At least one MUST/MUST NOT invariant relevant to this feature's blast radius
            - value: partial
              label: Partial
              criteria:
                - Invariants present but vague or not testable
            - value: fail
              label: Fail
              criteria:
                - Section empty
    - id: system_context
      name: System Context
      description: How the feature fits into the existing system.
      weight: 0.10
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: semantic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Clear context diagram showing integration with existing components
            - value: partial
              label: Partial
              criteria:
                - Context mentioned but integration points unclear
            - value: fail
              label: Fail
              criteria:
                - No system context provided
    - id: api_changes
      name: API Changes
      description: API additions and modifications, including idempotency and error semantics.
      weight: 0.16
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: deterministic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Complete API spec with backward compatibility assessment
                - Idempotency and error semantics addressed
            - value: partial
              label: Partial
              criteria:
                - Basic API changes listed but idempotency/error semantics missing
            - value: fail
              label: Fail
              criteria:
                - No API changes documented
    - id: data_changes
      name: Data Changes
      description: Schema changes and migration/compatibility approach.
      weight: 0.14
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: deterministic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Schema changes with migration plan and rollback/roll-forward strategy
            - value: not_applicable
              label: Not Applicable
              criteria:
                - Section states "Not applicable" with rationale (no schema or data changes)
            - value: partial
              label: Partial
              criteria:
                - Schema changes listed but migration unclear
            - value: fail
              label: Fail
              criteria:
                - Section blank with no applicability statement, despite schema changes existing
    - id: rollout_plan
      name: Rollout Plan
      description: Feature flags and phased rollout strategy.
      weight: 0.12
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: deterministic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Phased rollout with feature flags and rollback plan
            - value: partial
              label: Partial
              criteria:
                - Basic rollout mentioned
            - value: fail
              label: Fail
              criteria:
                - No rollout plan
    - id: testing_strategy
      name: Testing Strategy
      description: Testing approach for the feature (the TPD carries the full verification plan).
      weight: 0.08
      required: false
      class: specification_quality
      blocking: false
      evaluation: semantic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Unit, integration, and E2E testing approach defined
            - value: partial
              label: Partial
              criteria:
                - Some testing mentioned
            - value: fail
              label: Fail
              criteria:
                - No testing strategy
    - id: technical_ownership
      name: Technical Ownership
      description: Ownership, Dive Deep, Invent and Simplify, Highest Standards — does the design show the author dove into edge cases and simplified deliberately?
      weight: 0.12
      required: false
      class: leadership_principle
      blocking: false
      evaluation: semantic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Edge cases and failure modes are visibly considered, not just the happy path
                - Simplification choices are explicit and justified
            - value: partial
              label: Partial
              criteria:
                - Some depth but edge cases thin or simplification unexplained
            - value: fail
              label: Fail
              criteria:
                - Surface-level design with no evidence of deeper consideration
