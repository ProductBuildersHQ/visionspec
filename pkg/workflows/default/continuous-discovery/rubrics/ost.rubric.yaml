# Opportunity Solution Tree Rubric
# LLM-as-a-Judge evaluation criteria for OST documents
# Based on Teresa Torres's continuous discovery framework

id: ost-rubric
name: Opportunity Solution Tree Evaluation Rubric
version: "1.0"
description: |
  Evaluates Opportunity Solution Tree documents for a measurable outcome,
  evidence-based opportunities, rigorous solution and experiment design, and
  structural integrity of the tree. A healthy OST is driven by an outcome (not
  an output), grounded in research, and validated through experiments with
  falsifiable hypotheses.

passCriteria:
  scoreThresholds:
    pass: 80
    partial: 60

categories:
  - name: Outcome Definition
    weight: 25
    description: Evaluates the root outcome the tree targets
    criteria:
      - id: OD1
        name: Measurable Outcome
        weight: 15
        pass:
          description: The outcome has a metric, baseline, target, and timeframe
          indicators:
            - Named metric with current baseline value
            - Numeric target distinct from the baseline
            - Timeframe for reaching the target
        partial:
          description: Outcome measurable in principle but incomplete
          indicators:
            - Metric without baseline or target
            - No timeframe
        fail:
          description: Outcome unmeasurable
          indicators:
            - No metric identified
            - Aspirational statement with no numbers
      - id: OD2
        name: Outcome, Not Output
        weight: 10
        pass:
          description: The root describes a change in customer behavior or business result
          indicators:
            - Phrased as a behavior or result change
            - Not a feature, project, or deliverable
            - Linked to an OKR or strategic goal where applicable
        partial:
          description: Outcome conflated with outputs
          indicators:
            - Mixes a metric with a named feature to ship
            - Behavior change implied but not stated
        fail:
          description: Root is an output
          indicators:
            - Root node names a feature or project
            - Success defined as shipping

  - name: Opportunity Quality
    weight: 30
    description: Evaluates the opportunities layer — evidence, framing, and prioritization
    criteria:
      - id: OQ1
        name: Evidence Basis
        weight: 15
        pass:
          description: Each opportunity cites its research source and observed frequency
          indicators:
            - Source named per opportunity (interview, analytics, support, survey)
            - Frequency or prevalence recorded
            - Opportunities traceable to real customer input
        partial:
          description: Evidence thin or assumed
          indicators:
            - Sources for some opportunities only
            - Frequency missing
            - Team beliefs presented as findings
        fail:
          description: No evidence
          indicators:
            - No sources cited
            - Opportunities invented to justify existing solutions
      - id: OQ2
        name: Customer Framing
        weight: 8
        pass:
          description: Opportunities are customer problems, needs, or desires
          indicators:
            - Phrased from the customer's perspective
            - Free of embedded solutions
            - Specific enough to be addressed
        partial:
          description: Framing drifts toward solutions
          indicators:
            - Some opportunities are features in disguise
            - Framing too broad to act on
        fail:
          description: Not customer framed
          indicators:
            - Opportunities are internal tasks or features
            - Customer perspective absent
      - id: OQ3
        name: Prioritization
        weight: 7
        pass:
          description: Opportunities are prioritized with visible rationale
          indicators:
            - Priority assigned per opportunity
            - Ranking consistent with evidence strength or impact
        partial:
          description: Prioritization weak
          indicators:
            - Priorities assigned without rationale
            - All opportunities ranked equal
        fail:
          description: No prioritization
          indicators:
            - No priorities assigned

  - name: Solution & Experiment Rigor
    weight: 30
    description: Evaluates the solutions and experiments layers
    criteria:
      - id: SE1
        name: Solution Mapping
        weight: 12
        pass:
          description: Solutions map to specific opportunities with effort and impact assessed
          indicators:
            - Each solution attached to one opportunity
            - Type, effort, impact, and status recorded
            - Requirement references where solutions are being built
        partial:
          description: Solutions listed but weakly assessed
          indicators:
            - Effort or impact missing
            - Solutions unattached to opportunities
        fail:
          description: No solution assessment
          indicators:
            - Solutions absent
            - Single predetermined solution with no alternatives across the tree
      - id: SE2
        name: Experiment Design
        weight: 12
        pass:
          description: Experiments carry falsifiable hypotheses and concrete methods
          indicators:
            - Hypothesis states an expected measurable effect
            - Method, duration, and participants specified
            - Status tracked (planned, running, completed)
        partial:
          description: Experiments underspecified
          indicators:
            - Hypotheses not falsifiable
            - Method named without duration or participants
        fail:
          description: No experiments
          indicators:
            - Solutions proceed to build with no validation
            - Experiment sections empty
      - id: SE3
        name: Learning Loop
        weight: 6
        pass:
          description: Completed experiments record results, learnings, and next steps
          indicators:
            - Result recorded (success, failure, inconclusive)
            - Learning stated in customer or metric terms
            - Next step follows from the learning
        partial:
          description: Results without learning
          indicators:
            - Results recorded but no learning captured
            - Next steps disconnected from results
        fail:
          description: No learning captured
          indicators:
            - Completed experiments with empty results
            - Failures unexamined

  - name: Tree Integrity
    weight: 15
    description: Evaluates structural completeness and traceability of the tree
    criteria:
      - id: TI1
        name: Structural Completeness
        weight: 8
        pass:
          description: The tree is populated at every level without dead branches
          indicators:
            - Every opportunity has at least one solution or a stated reason it is parked
            - No placeholder nodes among active branches
            - Multiple opportunities considered, not a single chain
        partial:
          description: Tree sparse or uneven
          indicators:
            - Some opportunities without solutions and without rationale
            - Single-path tree suggesting predetermined thinking
        fail:
          description: Tree skeletal
          indicators:
            - Layers empty below the outcome
            - Structure exists but content placeholder
      - id: TI2
        name: Traceability
        weight: 7
        pass:
          description: Nodes carry stable IDs and link outward to OKRs and requirements
          indicators:
            - Stable IDs on outcome, opportunities, solutions, and experiments
            - OKR reference on the outcome where applicable
            - Requirement references on building/shipped solutions
        partial:
          description: Traceability partial
          indicators:
            - IDs on some layers only
            - External references missing where expected
        fail:
          description: No traceability
          indicators:
            - No stable IDs
            - Tree disconnected from OKRs and requirements
