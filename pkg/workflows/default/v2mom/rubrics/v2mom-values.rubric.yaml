# V2MOM Values Rubric
# LLM-as-a-Judge evaluation criteria for V2MOM Values documents
# Values are ranked beliefs that decide trade-offs: the higher-ranked value wins

id: v2mom-values-rubric
name: V2MOM Values Evaluation Rubric
version: "1.0"
description: |
  Evaluates V2MOM Values documents for definition quality, explicit ranking with
  usable trade-off guidance, and alignment. Values earn their place by deciding
  real conflicts — a value with no trade-off example is a slogan.

passCriteria:
  scoreThresholds:
    pass: 80
    partial: 60

categories:
  - name: Value Definition Quality
    weight: 40
    description: Evaluates each value's statement and practical grounding
    criteria:
      - id: VD1
        name: Statement Clarity
        weight: 20
        pass:
          description: Each value has a clear, action-oriented statement
          indicators:
            - Statements phrased as beliefs that guide action
            - Each value distinct — no overlapping restatements
            - No empty or placeholder value slots among ranked values
        partial:
          description: Values stated but vague or overlapping
          indicators:
            - Single-word values without statements
            - Two values that decide the same conflicts
            - Some slots placeholder
        fail:
          description: Values missing or generic
          indicators:
            - Empty values section
            - Generic virtues (quality, excellence) with no operational meaning
      - id: VD2
        name: Practice Grounding
        weight: 20
        pass:
          description: Each value's "In Practice" section shows how it shapes daily decisions
          indicators:
            - Concrete behaviors or decisions cited per value
            - A team member could apply the value without asking
            - Practice descriptions differ across values
        partial:
          description: Practice sections present but abstract
          indicators:
            - Restates the value instead of showing behavior
            - Only some values have practice sections
        fail:
          description: No practical grounding
          indicators:
            - In Practice sections empty
            - Values unusable for real decisions

  - name: Ranking & Trade-offs
    weight: 35
    description: Evaluates the priority ordering and trade-off examples
    criteria:
      - id: RT1
        name: Explicit Ranking
        weight: 15
        pass:
          description: Values are ranked and the ranking is meaningful
          indicators:
            - Clear 1..N priority order
            - Ranking matches the metadata block
            - Ordering rationale evident or stated
        partial:
          description: Ranking present but weak
          indicators:
            - Order given without rationale
            - Metadata ranking disagrees with document order
        fail:
          description: No ranking
          indicators:
            - Values listed unordered
            - Explicit statement that all values are equal
      - id: RT2
        name: Trade-off Examples
        weight: 20
        pass:
          description: Each value carries a concrete "we will X even if it means Y" trade-off
          indicators:
            - Trade-off names a real cost, not a strawman
            - Higher-ranked value visibly wins a plausible conflict
            - Trade-offs consistent with the ranking
        partial:
          description: Trade-offs present but toothless
          indicators:
            - Costs that no one would object to
            - Trade-offs missing for some values
            - Trade-offs contradict the stated ranking
        fail:
          description: No trade-off examples
          indicators:
            - Trade-off sections empty
            - Values never in tension by construction

  - name: Alignment & Decision Framework
    weight: 25
    description: Evaluates organizational alignment and the conflict-resolution process
    criteria:
      - id: AL1
        name: Values Alignment
        weight: 13
        pass:
          description: Values connect to organizational and parent V2MOM values
          indicators:
            - Organizational values alignment addressed
            - Parent values alignment addressed (or explicit N/A for company level)
            - Deviations from parent values justified
        partial:
          description: Alignment asserted without substance
          indicators:
            - Alignment claimed but not explained
            - Parent alignment missing for a non-company level
        fail:
          description: No alignment consideration
          indicators:
            - Alignment sections empty
            - Values conflict with parent values without acknowledgment
      - id: DF1
        name: Decision Framework
        weight: 12
        pass:
          description: A usable process exists for resolving value conflicts
          indicators:
            - Steps for identifying and resolving tension present
            - Trade-off decisions are documented per the framework
            - Framework references the ranking
        partial:
          description: Framework present but incomplete
          indicators:
            - Process listed without documentation step
            - Framework does not reference the ranking
        fail:
          description: No decision framework
          indicators:
            - Section empty
            - Conflicts resolved ad hoc by construction
