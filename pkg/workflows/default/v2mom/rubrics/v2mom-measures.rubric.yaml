# V2MOM Measures Rubric
# LLM-as-a-Judge evaluation criteria for V2MOM Measures documents
# Measures are SMART metrics that make method progress verifiable

id: v2mom-measures-rubric
name: V2MOM Measures Evaluation Rubric
version: "1.0"
description: |
  Evaluates V2MOM Measures documents for SMART measure definitions with
  baselines and targets, full coverage of methods, and a working tracking
  cadence. A measure without a baseline and data source is a wish, not a
  measure.

passCriteria:
  scoreThresholds:
    pass: 80
    partial: 60

categories:
  - name: Measurability
    weight: 40
    description: Evaluates each measure's definition, goals, and measurement method
    criteria:
      - id: ME1
        name: SMART Definition
        weight: 15
        pass:
          description: Each measure is precisely defined and time-bound
          indicators:
            - Definition states exactly what is measured
            - Unit and scope unambiguous
            - Timeframe tied to the fiscal period
        partial:
          description: Measures defined but ambiguous
          indicators:
            - Definitions open to interpretation
            - Unit or scope unclear
        fail:
          description: Measures undefined
          indicators:
            - Definition sections empty
            - Qualitative aspirations presented as measures
      - id: ME2
        name: Baseline, Target & Stretch
        weight: 15
        pass:
          description: Every measure has a baseline, target, and stretch value
          indicators:
            - Numeric baseline recorded as the starting point
            - Target and stretch distinct and justified
            - Values populated in both summary table and details
        partial:
          description: Goals present but incomplete
          indicators:
            - Targets without baselines
            - Stretch missing or equal to target
        fail:
          description: No goal values
          indicators:
            - Goals tables empty
            - Targets undefined
      - id: ME3
        name: Measurement Method
        weight: 10
        pass:
          description: Data source and calculation are specified per measure
          indicators:
            - Named data source
            - Calculation method stated
            - Method reproducible by someone else
        partial:
          description: Method partially specified
          indicators:
            - Source without calculation, or vice versa
            - Method requires tribal knowledge
        fail:
          description: No measurement method
          indicators:
            - Data source and calculation empty
            - Measure cannot be computed as described

  - name: Method Coverage
    weight: 30
    description: Evaluates whether measures cover the methods and roll up to the parent
    criteria:
      - id: MC1
        name: Coverage of Methods
        weight: 18
        pass:
          description: Every method has at least one measure tracking it
          indicators:
            - Each measure names the method it tracks
            - All methods from the Methods document are covered
            - Uncovered methods explicitly justified
        partial:
          description: Coverage incomplete
          indicators:
            - Some methods without measures
            - Measures reference methods that do not exist
        fail:
          description: No method linkage
          indicators:
            - Measures not tied to methods
            - Majority of methods unmeasured
      - id: MC2
        name: Parent Roll-up
        weight: 12
        pass:
          description: Non-company levels state how measures contribute to parent measures
          indicators:
            - Contributes-to and weight filled per measure (or explicit N/A for company level)
            - Referenced parent measures exist
        partial:
          description: Roll-up incomplete
          indicators:
            - Parent measure named without contribution weight
            - Roll-up for some measures only
        fail:
          description: No roll-up
          indicators:
            - Sections empty for a non-company level

  - name: Tracking & Cadence
    weight: 30
    description: Evaluates reporting frequency, progress tracking, and status
    criteria:
      - id: TC1
        name: Reporting Cadence
        weight: 15
        pass:
          description: Each measure has an owner and a reporting frequency
          indicators:
            - Frequency from the defined set (daily/weekly/monthly/quarterly)
            - Owner assigned per measure
            - Cadence appropriate to the measure's volatility
        partial:
          description: Cadence incomplete
          indicators:
            - Frequency for some measures only
            - Owners missing
        fail:
          description: No cadence
          indicators:
            - No frequencies or owners assigned
      - id: TC2
        name: Progress Tracking
        weight: 15
        pass:
          description: Progress structure is in place with per-period targets and status
          indicators:
            - Period targets laid out across the fiscal period
            - Status values use the defined legend
            - Summary table current and status consistent with actuals
        partial:
          description: Tracking scaffolding thin
          indicators:
            - Periods defined without targets
            - Status inconsistent with actuals
        fail:
          description: No progress tracking
          indicators:
