# V2MOM Alignment Rubric
# LLM-as-a-Judge evaluation criteria for V2MOM Cascade Alignment documents
# Alignment shows how a child V2MOM supports its parent's methods

id: v2mom-alignment-rubric
name: V2MOM Alignment Evaluation Rubric
version: "1.0"
description: |
  Evaluates V2MOM Cascade Alignment documents for complete method-to-parent
  mapping with honest gap analysis, measurable roll-up of measures, and managed
  sibling dependencies. Alignment is only useful when gaps and conflicts are
  surfaced, not smoothed over.

passCriteria:
  scoreThresholds:
    pass: 80
    partial: 60

categories:
  - name: Cascade Mapping
    weight: 40
    description: Evaluates the method-to-parent mapping and coverage analysis
    criteria:
      - id: CM1
        name: Method-to-Method Mapping
        weight: 20
        pass:
          description: Every method maps to a parent method with a stated contribution
          indicators:
            - Mapping table covers all of this V2MOM's methods
            - Contribution and coverage stated per mapping
            - Referenced parent methods exist in the parent V2MOM
        partial:
          description: Mapping incomplete
          indicators:
            - Some methods unmapped without explanation
            - Contributions vague or missing
        fail:
          description: No method mapping
          indicators:
            - Mapping table empty
            - Parent methods referenced do not exist
      - id: CM2
        name: Coverage & Gap Analysis
        weight: 20
        pass:
          description: Parent method coverage is assessed and gaps are called out
          indicators:
            - Coverage per parent method with contributing children
            - Uncovered or under-covered parent methods listed as gaps
            - Each gap has a recommendation
        partial:
          description: Coverage assessed but gaps soft-pedaled
          indicators:
            - Coverage numbers without gap analysis
            - Gaps listed without recommendations
        fail:
          description: No coverage analysis
          indicators:
            - Coverage tables empty
            - Known uncovered parent methods not acknowledged

  - name: Vision & Measure Roll-up
    weight: 30
    description: Evaluates vision alignment rationale and measure contribution
    criteria:
      - id: MR1
        name: Vision Alignment Rationale
        weight: 15
        pass:
          description: The child vision demonstrably advances parent methods
          indicators:
            - Alignment rationale explains the connection explicitly
            - Supported parent methods enumerated
            - Alignment score justified by the rationale
        partial:
          description: Alignment asserted, not argued
          indicators:
            - Score given without rationale
            - Supported methods listed without explanation
        fail:
          description: No vision alignment
          indicators:
            - Rationale empty
            - Child vision unrelated to parent methods
      - id: MR2
        name: Measure Roll-up
        weight: 15
        pass:
          description: Child measures roll up to parent measures with type and weight
          indicators:
            - Roll-up type from the defined set (sum/average/min/milestone)
            - Contribution weight per measure
            - Referenced parent measures exist
        partial:
          description: Roll-up partially specified
          indicators:
            - Parent measures named without type or weight
            - Some measures excluded without rationale
        fail:
          description: No measure roll-up
          indicators:
            - Roll-up table empty
            - Child measures disconnected from parent measures

  - name: Dependencies & Health
    weight: 30
    description: Evaluates sibling dependencies and the alignment health assessment
    criteria:
      - id: DH1
        name: Sibling Dependencies
        weight: 15
        pass:
          description: Dependencies on peer V2MOMs are identified and tracked
          indicators:
            - Siblings sharing parent methods identified
            - Cross-V2MOM dependencies with status per method
