        partial:
          description: Siblings acknowledged but dependencies untracked
          indicators:
            - Siblings listed without dependency status
            - Known shared work absent from the tables
        fail:
          description: Siblings ignored
          indicators:
            - Sibling sections empty with no statement
      - id: DH2
        name: Alignment Health Score
        weight: 15
        pass:
          description: The health score is computed and consistent with the analysis
          indicators:
            - Component scores (vision, coverage, roll-up, dependencies) filled
