# V2MOM Vision Rubric
# LLM-as-a-Judge evaluation criteria for V2MOM Vision documents
# The Vision is the north star: inspiring, clear, memorable, achievable

id: v2mom-vision-rubric
name: V2MOM Vision Evaluation Rubric
version: "1.0"
description: |
  Evaluates V2MOM Vision documents for statement quality, supporting rationale,
  and cascade alignment. A strong vision is a single compelling statement that
  the team can remember and act on, backed by rationale and a concrete picture
  of success.

passCriteria:
  scoreThresholds:
    pass: 80
    partial: 60

categories:
  - name: Vision Statement Quality
    weight: 40
    description: Evaluates the vision statement itself
    criteria:
      - id: VS1
        name: Clarity & Memorability
        weight: 15
        pass:
          description: A single, clear vision statement that is easy to understand and repeat
          indicators:
            - One primary statement, not a paragraph of goals
            - Free of jargon and unexplained acronyms
            - Short enough to be remembered and repeated
        partial:
          description: Vision stated but diluted or hard to retain
          indicators:
            - Multiple competing statements
            - Abstract language that needs interpretation
            - Overly long or compound phrasing
        fail:
          description: No clear vision statement
          indicators:
            - Missing or placeholder vision statement
            - A list of tasks instead of a future state
            - Contradictory statements
      - id: VS2
        name: Inspiration & Ambition
        weight: 12
        pass:
          description: Describes a motivating future state worth working toward
          indicators:
            - Articulates a meaningful change from today
            - Motivates action rather than describing status quo
            - Connects to customer or organizational impact
        partial:
          description: Future state described but uninspiring or incremental
          indicators:
            - Restates current work as the destination
            - Impact on customers or org left implicit
            - Ambition unclear
        fail:
          description: No future state articulated
          indicators:
            - Describes activities, not outcomes
            - No connection to impact
            - Vision indistinguishable from a task list
      - id: VS3
        name: Achievability
        weight: 13
        pass:
          description: Ambitious but realistic within the stated time horizon
          indicators:
            - Time horizon explicitly stated
            - Scope plausible for the level (company/department/team)
            - Grounded in known capabilities or credible bets
        partial:
          description: Achievability unclear
          indicators:
            - No time horizon given
            - Scope mismatched to the V2MOM level
            - No grounding for feasibility
        fail:
          description: Unachievable or unbounded
          indicators:
            - No horizon and no scope boundaries
            - Vision requires capabilities with no path to acquire
            - Fantasy-level ambition without rationale

  - name: Rationale & Success Picture
    weight: 35
    description: Evaluates the Vision Rationale sections (why, success picture, horizon)
    criteria:
      - id: RA1
        name: Why This Vision
        weight: 15
        pass:
          description: Rationale explains why this vision matters and how it supports strategy
          indicators:
            - Explicit link to organizational goals or strategy
            - Explains why now, not just why in general
            - Addresses what happens if the vision is not pursued
        partial:
          description: Rationale present but shallow
          indicators:
            - Generic justification without strategic link
            - No urgency or timing rationale
            - Restates the vision instead of justifying it
        fail:
          description: No rationale
          indicators:
            - Section empty or placeholder
            - Circular reasoning
            - No connection to strategy
      - id: RA2
        name: Success Picture
        weight: 12
        pass:
          description: Concrete, observable description of what success looks like
          indicators:
            - Describes observable end-state conditions
            - A reader could verify whether success was achieved
            - Consistent with the vision statement
        partial:
          description: Success described but not observable
          indicators:
            - Vague descriptors (better, faster, leading)
            - Not verifiable from the description
            - Partially inconsistent with the vision
        fail:
          description: No success picture
          indicators:
            - Section empty or placeholder
            - Success undefined or deferred
      - id: RA3
        name: Time Horizon
        weight: 8
        pass:
          description: Clear expected timeframe for achieving the vision
          indicators:
            - Specific horizon stated (e.g., fiscal period, year)
            - Horizon consistent with fiscal period metadata
        partial:
          description: Horizon implied but not stated
          indicators:
            - Only inferable from context
            - Conflicts with fiscal period metadata
        fail:
          description: No time horizon
          indicators:
            - Section empty
            - Open-ended "someday" framing

  - name: Alignment & Traceability
    weight: 25
    description: Evaluates parent alignment and metadata completeness
    criteria:
      - id: AL1
        name: Parent Alignment
        weight: 15
        pass:
          description: Non-company levels reference the parent vision and map supporting methods
          indicators:
            - Parent vision referenced (or explicitly N/A for company level)
            - Supporting-methods table maps this vision to parent methods
            - Contribution to each parent method explained
        partial:
          description: Parent alignment asserted but not mapped
          indicators:
            - Parent named without method mapping
            - Mapping table incomplete
            - Company level without explicit N/A
        fail:
          description: No parent alignment
          indicators:
            - Section empty for a non-company level
            - Mapped parent methods do not exist
      - id: AL2
        name: Metadata & Links
        weight: 10
        pass:
          description: Metadata block and ProductContext links are complete
          indicators:
            - Level, fiscal period, and owner filled
            - Metadata block matches document content
            - Strategy/capability links populated where applicable
        partial:
          description: Metadata present but incomplete
          indicators:
            - Some fields placeholder
            - Metadata inconsistent with body content
        fail:
          description: Metadata missing
          indicators:
            - Metadata block absent or all placeholders
            - No owner identified
