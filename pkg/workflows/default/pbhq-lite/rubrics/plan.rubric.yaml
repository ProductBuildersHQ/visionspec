id: pbhq-plan-rubric
name: PLAN Evaluation (PBHQ Lite)
version: "1.0"
description: Evaluation of Implementation Plans for PBHQ Lite workflow. Focus on sequencing, dependencies, and milestone clarity.
evaluationType: analytic
passCriteria:
  minCategoriesPassing: all_required
  maxFindingsSeverity:
    critical: 0
    high: 1
    medium: 3
    low: -1
categories:
  - id: phase_structure
    name: Phase Structure
    description: Clear breakdown of work into phases
    weight: 0.25
    required: true
    class: specification_quality
    blocking: false
    evaluation: semantic
    scale:
      type: categorical
      options:
        - value: pass
          label: Pass
          criteria:
            - Work broken into logical, numbered phases
            - Each phase has clear theme and deliverables
            - Phases are right-sized (neither too large nor fragmented)
        - value: partial
          label: Partial
          criteria:
            - Phases exist but scope per phase unclear
        - value: fail
          label: Fail
          criteria:
            - No phase structure or monolithic plan

  - id: dependencies
    name: Dependency Mapping
    description: Clear articulation of what blocks what
    weight: 0.20
    required: true
    class: specification_quality
    blocking: false
    evaluation: semantic
    scale:
      type: categorical
      options:
        - value: pass
          label: Pass
          criteria:
            - Inter-phase dependencies explicit
            - Critical path identifiable
            - Parallel work streams identified
        - value: partial
          label: Partial
          criteria:
            - Some dependencies noted but incomplete
        - value: fail
          label: Fail
          criteria:
            - Dependencies not documented

  - id: milestones
    name: Milestones
    description: Checkpoints with measurable completion criteria
    weight: 0.20
    required: true
    class: implementation_readiness
    blocking: true
    evaluation: deterministic
    scale:
      type: categorical
      options:
        - value: pass
          label: Pass
          criteria:
            - Each phase has exit criteria
            - Milestones are demonstrable (not just "done")
        - value: partial
          label: Partial
          criteria:
            - Milestones exist but criteria vague
        - value: fail
          label: Fail
          criteria:
            - No milestones defined

  - id: risk_identification
    name: Risk Identification
    description: Known risks and mitigation strategies
    weight: 0.15
    class: specification_quality
    blocking: false
    evaluation: semantic
    scale:
      type: categorical
      options:
        - value: pass
          label: Pass
          criteria:
            - Key risks identified with likelihood/impact
            - Mitigation strategies or contingencies specified
        - value: partial
          label: Partial
          criteria:
            - Risks mentioned but no mitigation plan
        - value: fail
          label: Fail
          criteria:
            - No risk discussion

  - id: traceability
    name: Traceability
    description: Link back to PRD requirements and TRD components
    weight: 0.20
    required: true
    class: implementation_readiness
    blocking: true
    evaluation: deterministic
    scale:
      type: categorical
      options:
        - value: pass
          label: Pass
          criteria:
            - Plan items trace to PRD user stories or requirements
            - Technical work traces to TRD components
        - value: partial
          label: Partial
          criteria:
            - Some traceability but gaps exist
        - value: fail
          label: Fail
          criteria:
            - No traceability to source specs
