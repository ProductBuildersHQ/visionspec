id: pbhq-prd-rubric
name: PRD Evaluation (PBHQ Lite)
version: "1.0"
description: Evaluation of Product Requirements Documents for PBHQ Lite workflow. Focus on clarity, completeness, and actionability.
evaluationType: analytic
passCriteria:
  minCategoriesPassing: all_required
  maxFindingsSeverity:
    critical: 0
    high: 1
    medium: 3
    low: -1
categories:
  - id: problem_definition
    name: Problem Definition
    description: Clarity of the problem being solved
    weight: 0.25
    required: true
    scale:
      type: categorical
      options:
        - value: pass
          label: Pass
          criteria:
            - Problem is specific, measurable, and clearly impacts target users
            - Current state and desired state are articulated
        - value: partial
          label: Partial
          criteria:
            - Problem exists but lacks specificity or user impact clarity
        - value: fail
          label: Fail
          criteria:
            - No clear problem statement or unclear who is affected

  - id: goals_and_nongoals
    name: Goals and Non-Goals
    description: Explicit definition of scope boundaries
    weight: 0.20
    required: true
    scale:
      type: categorical
      options:
        - value: pass
          label: Pass
          criteria:
            - Goals are measurable with success criteria
            - Non-goals explicitly exclude scope creep areas
        - value: partial
          label: Partial
          criteria:
            - Goals exist but non-goals missing or vague
        - value: fail
          label: Fail
          criteria:
            - Goals and scope missing or unmeasurable

  - id: user_stories
    name: User Stories
    description: Quality of user stories and acceptance criteria
    weight: 0.20
    required: true
    scale:
      type: categorical
      options:
        - value: pass
          label: Pass
          criteria:
            - Stories follow "As a X, I want Y, so that Z" format
            - Acceptance criteria are testable
        - value: partial
          label: Partial
          criteria:
            - Stories exist but acceptance criteria incomplete
        - value: fail
          label: Fail
          criteria:
            - User stories missing or not in standard format

  - id: requirements
    name: Functional Requirements
    description: Completeness and testability of requirements
    weight: 0.20
    required: true
    scale:
      type: categorical
      options:
        - value: pass
          label: Pass
          criteria:
            - Requirements are numbered and traceable
            - Each requirement is independently testable
        - value: partial
          label: Partial
          criteria:
            - Requirements exist but some are ambiguous
        - value: fail
          label: Fail
          criteria:
            - Functional requirements missing or untestable

  - id: success_metrics
    name: Success Metrics
    description: Definition of how success will be measured
    weight: 0.15
    required: true
    scale:
      type: categorical
      options:
        - value: pass
          label: Pass
          criteria:
            - Metrics are quantitative with baseline and target
            - Measurement method is specified
        - value: partial
          label: Partial
          criteria:
            - Metrics exist but lack specificity or baselines
        - value: fail
          label: Fail
          criteria:
            - Success metrics missing
