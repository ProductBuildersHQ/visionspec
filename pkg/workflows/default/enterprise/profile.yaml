name: enterprise
description: "Comprehensive configuration for post-PMF enterprises. Full specs with security and compliance. MRD includes embedded Business Model Canvas."

spec_config:
  # Source specs: all required
  mrd:
    required: true
    category: source
    description: "Market requirements with embedded Business Model Canvas"
  prd:
    required: true
    category: source
  uxd:
    required: true
    category: source

  # Business Model Canvas: synthesized from MRD
  bmc:
    required: false
    category: gtm
    description: "Business Model Canvas extracted from MRD for stakeholder review"

  # GTM specs. The Amazon Working Backwards discovery artifacts (press, faq,
  # narrative-6p) are NOT owned here — enterprise is the cross-methodology
  # contract layer (MRD/PRD/UXD/TRD/TPD/IRD/spec). Those three live in their
  # canonical home, aws-one-way-door; families that use them source
  # {from: aws-one-way-door}.
  narrative-1p:
    required: false
    category: gtm

  # Technical specs
  trd:
    required: true
    category: technical
  tpd:
    required: true
    category: technical
    description: "Test plan document"
  ird:
    required: false
    category: technical
    description: "Infrastructure requirements"

  # Output specs
  spec:
    required: true
    category: output

# Synthesis rules
synthesis:
  bmc:
    sources:
      - mrd
    guidance: "Extract Business Model Canvas blocks from MRD sections 2-11. Format as standalone canvas for visual review."

  prd:
    sources:
      - mrd
    guidance: "Derive product requirements from market requirements. Map to customer segments. (The Working Backwards press/faq-first flow is an aws-one-way-door override, not the enterprise base.)"

  trd:
    sources:
      - prd
      - uxd
    guidance: "Technical design to support PRD requirements."

  tpd:
    sources:
      - prd
      - trd
    guidance: "Test plan covering all PRD requirements with traceability."

  spec:
    sources:
      - mrd
      - prd
      - uxd
      - trd
      - tpd
    guidance: "Unified specification consolidating all approved specs."
