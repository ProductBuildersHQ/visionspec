id: trd-rubric
name: Enterprise TRD Rubric
version: "2.0"
description: >-
  Technical Requirements Document evaluation for enterprise implementations.
  The TRD is a technical contract: categories tagged implementation_readiness
  are blocking gates on whether an agent could implement and verify the spec
  without guessing. Categories tagged specification_quality describe design
  narrative and inform review but do not block on their own. A category with a
  not_applicable option accepts "Not applicable — <rationale>" as a complete,
  passing answer; leaving it blank is a fail, not an exemption.
evaluationType: analytic
judgeInstructions:
  - Cite the relevant section and TRD/PRD/TPD ID for every finding.
  - Distinguish missing evidence (section absent) from negative evidence (section present but inadequate).
  - A row reading "Not applicable — <rationale>" with a real rationale counts as pass, not fail or missing.
  - A row that is blank, says "N/A" alone, or restates the requirement without a rationale counts as fail.
  - Do not reward length; reward traceable, measurable, testable statements.
passCriteria:
    minCategoriesPassing: all_required
    maxFindingsSeverity:
        critical: 0
        high: 0
        medium: 2
        low: -1
categories:
    - id: requirements_traceability
      name: Requirements & Traceability
      description: Does every applicable PRD/UXD requirement map to a TRD requirement, and every TRD requirement to a TPD verification?
      weight: 0.16
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: deterministic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Every TRD-ID row has a source PRD/UXD ID and a TPD verification ID
                - Every applicable PRD requirement has a corresponding TRD-ID or an explicit "Not applicable — <rationale>"
                - IDs referenced exist elsewhere in the document set (no dangling references)
            - value: partial
              label: Partial
              criteria:
                - Some TRD-IDs missing a source or verification reference
                - A few PRD requirements unmapped without rationale
            - value: fail
              label: Fail
              criteria:
                - No traceability table, or IDs are absent/inconsistent throughout
    - id: system_invariants
      name: System Invariants
      description: Are cross-cutting guarantees stated as explicit, testable invariants?
      weight: 0.14
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: semantic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - At least one invariant per cross-cutting concern relevant to this system (tenancy, consistency, idempotency, lifecycle)
                - Invariants use MUST / MUST NOT language and are independently verifiable
            - value: partial
              label: Partial
              criteria:
                - Some invariants present but vague or not testable
            - value: fail
              label: Fail
              criteria:
                - Section empty or restates functional requirements instead of cross-cutting guarantees
    - id: interface_contracts
      name: Interface Contracts
      description: Are inputs, outputs, validation, auth, errors, idempotency, and versioning fully specified?
      weight: 0.14
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: deterministic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Request/response fields, types, and validation rules specified
                - Authentication and authorization model stated
                - Error codes enumerated with retryability
                - Idempotency, pagination, versioning, and rate limits each addressed or marked "Not applicable — <rationale>"
            - value: partial
              label: Partial
              criteria:
                - Endpoints listed but validation, errors, or auth incomplete
            - value: fail
              label: Fail
              criteria:
                - No interface contract, or only a bare endpoint list with no field-level detail
    - id: state_lifecycle
      name: State and Lifecycle
      description: For stateful entities, are states, transitions, idempotency, and concurrency behavior defined?
      weight: 0.10
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: deterministic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - States, valid transitions, and triggers enumerated
                - Idempotency and concurrent-operation behavior stated
                - Terminal and recovery states identified
            - value: not_applicable
              label: Not Applicable
              criteria:
                - Document states "Not applicable" with a rationale explaining why no entity in this change has meaningful lifecycle state
            - value: partial
              label: Partial
              criteria:
                - States listed but transitions, idempotency, or concurrency behavior missing
            - value: fail
              label: Fail
              criteria:
                - Section blank with no applicability statement, despite the system having stateful entities
    - id: operational_guarantees
      name: Operational Guarantees
      description: Are performance, reliability, capacity, and observability requirements measurable?
      weight: 0.14
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: deterministic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Every row is a number, a measurement method, or "Not applicable — <rationale>"
                - No row uses unquantified language (fast, robust, scalable) as the requirement itself
            - value: partial
              label: Partial
              criteria:
                - Some rows quantified, others vague or blank without rationale
            - value: fail
              label: Fail
              criteria:
                - Requirements stated only in qualitative terms, or section empty
    - id: security_design
      name: Security and Privacy
      description: Enterprise security architecture and controls.
      weight: 0.12
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: deterministic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Authentication, authorization, encryption at rest and in transit, and audit logging all addressed
                - Any unchecked control has a stated rationale
            - value: partial
              label: Partial
              criteria:
                - Most controls addressed but one or more unchecked without rationale
            - value: fail
              label: Fail
              criteria:
                - Security section missing or only generic statements
    - id: compatibility_migration
      name: Compatibility and Migration
      description: Are version compatibility, migration phases, and rollback boundaries defined?
      weight: 0.08
      required: true
      class: implementation_readiness
      blocking: true
      evaluation: deterministic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Forward/backward compatibility, migration phases, validation, and rollback boundary all stated
            - value: not_applicable
              label: Not Applicable
              criteria:
                - Document states "Not applicable" with a rationale (e.g., net-new system, no existing data or version to remain compatible with)
            - value: partial
              label: Partial
              criteria:
                - Migration phases stated but rollback boundary or mixed-version behavior missing
            - value: fail
              label: Fail
              criteria:
                - Section blank with no applicability statement, despite an existing system or schema being changed
    - id: architecture_clarity
      name: Architecture Clarity
      description: How clearly the system architecture is described.
      weight: 0.07
      required: false
      class: specification_quality
      blocking: false
      evaluation: semantic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Clear architecture with diagram, component responsibilities, and data flow
            - value: partial
              label: Partial
              criteria:
                - Basic architecture present but lacks detail
            - value: fail
              label: Fail
              criteria:
                - No architecture described
    - id: data_design
      name: Data Design
      description: Quality of data models and storage design.
      weight: 0.05
      required: false
      class: specification_quality
      blocking: false
      evaluation: semantic
      scale:
        type: categorical
        options:
            - value: pass
              label: Pass
              criteria:
                - Data models and storage rationale present
            - value: partial
              label: Partial
              criteria:
                - Basic data design present
            - value: fail
              label: Fail
              criteria:
                - No data design
